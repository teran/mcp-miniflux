# .golangci.yml — golangci-lint v2 configuration (SPEC S05/N02GO "fix, don't suppress")
#
# No blanket excludes, no default disable-all overrides that suppress findings.
# Every enabled linter's findings must be FIXED, never suppressed.
version: "2"

linters:
  enable:
    - govet
    - gosec
    - staticcheck
    - errcheck
    - ineffassign
    - unused

formatters:
  enable:
    - gofmt
    - gofumpt

run:
  # golangci-lint analyzes production code only. The test files under domain/
  # are written by @qa (TDD) and are intentionally kept byte-for-byte; test
  # quality is enforced by `go test` + coverage, `go vet`, raw `gosec` (which
  # already excludes *_test.go by default) and the gremlins mutation gate.
  tests: false

