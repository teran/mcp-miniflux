# .gitleaks.toml — secret scan over git history (SPEC C03/N28, S05/N02GO)
#
# This config EXTENDS the default gitleaks ruleset via [extend] useDefault =
# true, so no built-in secret rule is suppressed. Real secrets must be FIXED
# (removed/rotated), never allowlisted. There is intentionally NO [allowlists]
# section — adding broad allowlists here would suppress real findings (N02GO).
title = "gitleaks config for mcp-miniflux"

[extend]
# Keep ALL default gitleaks secret rules active; this file only adds to them.
useDefault = true
