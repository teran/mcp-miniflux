# .github/workflows/ci.yml — GitHub Actions (SPEC §11.2 R06)
#
# 4-stage pipeline bound to the build-system interface (R07/N31):
#   linters -> build -> tests -> release artifacts
# Plus two dedicated hard-gate jobs NOT part of the make interface:
#   gremlins mutation (C02/C08GO) and gitleaks secret scan (C03/N28).
# No job invokes an undeclared optional target. Findings are FIXED, never
# suppressed (S05/N02GO). No e2e job — no e2e suite exists (§11.5, C04/T02 N/A).
name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  # Pinned toolchain versions (single source of truth: reference/versions.md)
  GREMLINS_VERSION: "v0.6.0"
  GITLEAKS_VERSION: "v8.30.1"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.8.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1 — linters (make lint): golangci-lint + vet + gosec + govulncheck + go-arch-lint
  lint:
    name: Linters (make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install toolchain
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/fe3dback/go-arch-lint@v1.19.0
      - name: Run make lint
        run: make lint

  # Stage 2 — build (make build): goreleaser single binary per platform
  build:
    name: Build (make build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install goreleaser
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.18.2
      - name: Run make build
        run: make build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Stage 3 — tests (make test): go test -race + coverage >= 95% gate
  test:
    name: Tests (make test, coverage >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run make test
        run: make test

  # Hard gate — mutation testing (gremlins), NOT part of the make interface.
  # Fails the build below 80% efficacy / 80% mutation coverage (C02/C08GO/N03GO).
  mutation:
    name: Mutation gate (gremlins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}
      - name: Run gremlins unleash
        run: gremlins unleash ./... --threshold-efficacy=80 --threshold-mcover=80

  # Hard gate — secret scan (gitleaks) over git history (C03/N28).
  # Full history required; findings fixed, never suppressed.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # The gitleaks module path is still github.com/zricethezav/gitleaks/v8
          # (the go.mod declares the legacy owner path even though the repo moved
          # to github.com/gitleaks/gitleaks), so installing via the newer path
          # fails with a version-constraints conflict (C03/N28).
          go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - name: Run gitleaks detect
        run: gitleaks detect --source . --redact --verbose

  # Live badge publishing — recompute each quality metric and force-push the
  # shields.io/endpoint JSON files to a dedicated `badges` branch so the README
  # badges can resolve them via raw.githubusercontent.com. Reporting-only job:
  # it re-runs the checks itself so it OWNS its outputs (independent of the make
  # interface, R07 — these are dedicated-gate style tools). It is gated on the
  # real quality jobs (`needs`) so badges only (re)publish on a passing build,
  # and its own re-run determines the pass/fail color shown. Pushes only to the
  # `badges` branch — never to `master` — so it never re-triggers this workflow.
  badges:
    name: Publish live CI badges
    if: github.ref == 'refs/heads/master'
    needs: [lint, build, test, mutation, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install badge toolchain
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}
      # Recompute each metric and emit valid shields.io/endpoint JSON files.
      # Pass = brightgreen, warning = yellow, fail = red. Files are staged into
      # $RUNNER_TEMP/badges and published by the next step.
      - name: Generate badge JSON
        id: gen
        env:
          BADGE_DIR: ${{ runner.temp }}/badges
        run: |
          set -euo pipefail
          mkdir -p "$BADGE_DIR"

          # --- coverage (%) from `go test` ---
          go test ./... -coverprofile=coverage.out
          COV=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          COV_NUM=$(awk -v c="$COV" 'BEGIN{printf "%.1f", c}')
          if awk -v c="$COV_NUM" 'BEGIN{exit !(c >= 95.0)}'; then
            COV_COLOR=brightgreen
          elif awk -v c="$COV_NUM" 'BEGIN{exit !(c >= 90.0)}'; then
            COV_COLOR=yellow
          else
            COV_COLOR=red
          fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$COV_NUM" "$COV_COLOR" > "$BADGE_DIR/coverage.json"

          # --- gosec: "Issues : N" count; pass only when 0 issues ---
          set +e
          GOSEC_OUT=$(gosec ./... 2>&1)
          GOSEC_RC=$?
          set -e
          GOSEC_ISSUES=$(printf '%s' "$GOSEC_OUT" | grep -oE 'Issues : [0-9]+' | awk '{print $3}' || true)
          GOSEC_ISSUES=${GOSEC_ISSUES:-0}
          if [ "$GOSEC_RC" -eq 0 ] && [ "$GOSEC_ISSUES" = "0" ]; then
            GOSEC_MSG="pass (0 issues)"; GOSEC_COLOR=brightgreen
          else
            GOSEC_MSG="fail ($GOSEC_ISSUES issues)"; GOSEC_COLOR=red
          fi
          printf '{"schemaVersion":1,"label":"gosec","message":"%s","color":"%s"}\n' \
            "$GOSEC_MSG" "$GOSEC_COLOR" > "$BADGE_DIR/gosec.json"

          # --- govulncheck: pass only when "No vulnerabilities found." ---
          set +e
          VULN_OUT=$(govulncheck ./... 2>&1)
          VULN_RC=$?
          set -e
          if [ "$VULN_RC" -eq 0 ] && printf '%s' "$VULN_OUT" | grep -q "No vulnerabilities found."; then
            VULN_MSG="pass"; VULN_COLOR=brightgreen
          else
            VULN_MSG="fail"; VULN_COLOR=red
          fi
          printf '{"schemaVersion":1,"label":"govulncheck","message":"%s","color":"%s"}\n' \
            "$VULN_MSG" "$VULN_COLOR" > "$BADGE_DIR/govulncheck.json"

          # --- gremlins: exit 0 (>=80% efficacy / >=80% mcover) => pass ---
          set +e
          gremlins unleash ./... --threshold-efficacy=80 --threshold-mcover=80 >/dev/null 2>&1
          GREMLINS_RC=$?
          set -e
          if [ "$GREMLINS_RC" -eq 0 ]; then
            GREMLINS_MSG="pass"; GREMLINS_COLOR=brightgreen
          else
            GREMLINS_MSG="fail"; GREMLINS_COLOR=red
          fi
          printf '{"schemaVersion":1,"label":"gremlins","message":"%s","color":"%s"}\n' \
            "$GREMLINS_MSG" "$GREMLINS_COLOR" > "$BADGE_DIR/gremlins.json"

          echo "BADGE_DIR=$BADGE_DIR" >> "$GITHUB_OUTPUT"
          echo "Generated badge files:"
          ls -la "$BADGE_DIR"
      # Publish to the dedicated `badges` branch. Idempotent: force-pushes the
      # same JSON on repeated builds, and only commits when content changed.
      - name: Publish badges to badges branch
        env:
          BADGE_DIR: ${{ steps.gen.outputs.BADGE_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reset (or create) the `badges` branch at current HEAD, then keep only
          # the badge JSON files on it (orphan-style, no master history).
          git checkout -B badges
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          mkdir -p badges
          cp "$BADGE_DIR"/*.json badges/
          git add badges
          if git diff --cached --quiet; then
            echo "Badge files unchanged; nothing to push"
          else
            git commit -m "chore: update live CI badges [skip ci]"
            git push -f origin badges
          fi

  # Stage 4 — release artifacts (tags + master): binaries on tags, images on
  # both. goreleaser release runs ONLY on git tags (B01/B04); `make
  # container-image push=true` runs on tags AND master with the R03/R04 tag sets.
  release:
    name: Release artifacts (tags + master images)
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    needs: [lint, build, test, mutation, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser release publishes the binary artifacts to the GitHub Release —
      # TAG ONLY (B01/B04). Bound to the make interface (R07/N31): make release.
      - name: Goreleaser release (make release, tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Derive the R03/R04 multi-tag set from GitHub context (R03/R04).
      #   tag X    -> IMAGE_TAG=X, EXTRA_TAGS=X-{ts},X-{commit},X-{commit}-{ts}
      #   master   -> IMAGE_TAG=master-{commit}, EXTRA_TAGS=master-{ts},master-{commit}-{ts}
      - name: Compute image tag set
        id: meta
        shell: bash
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          C=${GITHUB_SHA::7}
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=${GITHUB_REF_NAME}
            echo "IMAGE_TAG=${TAG}" >> "$GITHUB_OUTPUT"
            echo "EXTRA_TAGS=${TAG}-${TS},${TAG}-${C},${TAG}-${C}-${TS}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=master-${C}" >> "$GITHUB_OUTPUT"
            echo "EXTRA_TAGS=master-${TS},master-${C}-${TS}" >> "$GITHUB_OUTPUT"
          fi
      # Build + push the image from the `make build` dist/ artifact (B04/N18),
      # tags and master alike — via the make interface (R07/N31).
      #
      # TODO (B02): `make container-image` rebuilds via goreleaser snapshot,
      # so the binary's embedded appVersion is a snapshot string, NOT the git
      # tag X. For a tagged release (R03) the embedded appVersion should equal
      # the image tag X. Pass the actual version through to goreleaser here —
      # e.g. export VERSION=${GITHUB_REF_NAME} (or GORELEASER_CURRENT_TAG) and
      # have the Makefile forward it to `goreleaser build`/`release` so
      # {{ .Version }} == X. See SPEC §11.4 (B02 — embedded appVersion vs tag).
      - name: Build and push container image (make container-image push=true)
        run: make container-image push=true
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
          EXTRA_TAGS: ${{ steps.meta.outputs.EXTRA_TAGS }}
