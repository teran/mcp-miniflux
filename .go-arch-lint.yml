# .go-arch-lint.yml — layer-edge enforcement (SPEC §6.1, C07GO)
#
# Components map to the top-level packages. Allowed edges:
#   cmd -> application, infrastructure   (wiring / composition root)
#   application -> domain                (uses domain types/ports)
#   infrastructure -> domain             (implements domain ports)
#   domain -> (nothing)                  (innermost leaf)
# Every other edge fails CI.
#
# Third-party libraries (go-sdk, resty, logrus, prometheus, envconfig) are
# vendor code and are allowed from ANY layer (depOnAnyVendor = true), as
# required by SPEC §6.1 ("Third-party vendored libraries ... allowed from any
# layer").
version: 3

allow:
  depOnAnyVendor: true

components:
  cmd:
    in:
      - cmd
      - cmd/**
  application:
    in:
      - application
      - application/**
  infrastructure:
    in:
      - infrastructure/**
  domain:
    in:
      - domain
      - domain/**

deps:
  cmd:
    mayDependOn:
      - application
      - infrastructure
  application:
    mayDependOn:
      - domain
  infrastructure:
    mayDependOn:
      - domain
  domain:
    anyVendorDeps: true
